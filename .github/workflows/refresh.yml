# Collects current market data and rebuilds the study from it.
#
# Deliberately does NOT commit the rebuilt artifacts. One run regenerates about 82 MB of them -
# a 24 MB hub, a 17 MB dashboard, a 35 MB emission table, a 6 MB PDF - and committing that daily
# would add roughly 30 GB a year to a repository that is 673 MB today. Git stores every version
# of a binary in full, so the history would outgrow the work by an order of magnitude within
# months.
#
# Instead the run uploads what it built and reports whether it is sound. Publishing the site
# from these artifacts (Pages, or a release) is the natural next step, and is a decision about
# how the project distributes its output rather than something to switch on inside a workflow.

name: refresh

on:
  schedule:
    # 06:00 UTC, after the upstream price archive's own daily run.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      collect:
        description: "Fetch live order books (slow: rate-limited to 1 request / 5s)"
        type: boolean
        default: true
      commit:
        description: "Commit the rebuilt artifacts back to main"
        type: boolean
        default: false

# The commit step pushes to main, which the default token cannot do without this.
permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the full pipeline
        run: pip install -r requirements.txt

      - name: Fetch the price archive
        # The one input this project cannot regenerate. 02_ingest_prices.py looks here by
        # default; TIBIA_PRICE_ARCHIVE overrides it.
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/nesleykent/tibia-warzones-schedule /tmp/tibia-warzones
          cd /tmp/tibia-warzones && git sparse-checkout set data/market/world

      - name: Collect live order books
        if: inputs.collect != false
        # api.tibiamarket.top allows one request every five seconds and answers 429 above that,
        # so 93 worlds take about ten minutes. --refresh ignores the on-disk cache, without
        # which the collector reports "cached" for every world and fetches nothing.
        run: python scripts/01_collect.py --refresh
        continue-on-error: true

      - name: Rebuild
        # No archive is cloned here. The kill-statistics history stages skip when the tracked
        # tables already cover their window, and 34_gold_emission keeps the tracked series when
        # the 4.2 GB recent archive is absent, so the run needs 166 MB of prices and nothing else.
        run: python scripts/run_all.py --no-collect

      - name: Published numbers are current
        run: python scripts/54_verify_freshness.py

      - name: The site publishes every unit of the report
        run: python scripts/52_coverage_manifest.py

      - name: Upload rebuilt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            reports/intelligence_hub.html
            reports/tibia_coin_market_report.pdf
            reports/gold_emission_dashboard.html
            reports/gold_emission_report.html
            reports/creature_gp_per_kill.html
            data/processed/coverage_manifest.csv
            data/processed/decision_policy.csv
          retention-days: 14

      - name: Commit the rebuilt artifacts
        # Off by default, and off for the scheduled run: one rebuild is ~82 MB and git keeps every
        # version of a binary in full, so committing nightly would add ~30 GB a year. Worth it
        # when a run is requested precisely so the result is waiting in the repository.
        if: inputs.commit == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed reports data/raw || true
          if git diff --cached --quiet; then
            echo "nothing changed" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Refresh market data and rebuild artifacts (run ${{ github.run_number }})"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
            echo "committed and pushed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report what changed
        if: always()
        run: |
          echo "### Refresh result" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pandas as pd
          panel = pd.read_csv("data/processed/panel_daily.csv", usecols=["date"])
          print(f"- cleaned panel ends **{pd.to_datetime(panel.date).max().date()}**")
          try:
              policy = pd.read_csv("data/processed/decision_policy.csv")
              counts = ", ".join(f"{n} {a}" for a, n in policy.action.value_counts().items())
              print(f"- decisions: {counts}")
          except Exception as error:
              print(f"- decisions unavailable: {error}")
          PY
          git status --porcelain -- data reports | head -20 >> "$GITHUB_STEP_SUMMARY" || true
